# Gradle daemon JVM — each idle daemon reserves this RAM (was 8G heap + 4G metaspace → 35+ zombie daemons).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Stop idle daemons after 10 minutes (Gradle default is 3 hours).
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000

# Conservative parallelism — set false if the machine is RAM-starved (many Cursor + Gradle daemons).
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.workers.max=2

# Kotlin compiler daemon runs in its own JVM — cap separately from Gradle.
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Avoid Kotlin incremental crash when project is on E: and Pub cache on C:
kotlin.incremental=false
kotlin.incremental.android=false

# --- Low-RAM profile (optional: replace org.gradle.jvmargs above when idle builds are enough) ---
# org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+UseG1GC -Dfile.encoding=UTF-8
# org.gradle.daemon=true
# org.gradle.parallel=false
# org.gradle.workers.max=1
# kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=128m
# Use one Gradle version/user home (~/.gradle) — avoid duplicate wrapper versions spawning extra daemons.
