name: Build & Release

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
  workflow_dispatch:
    inputs:
      publish_testflight:
        description: 'Upload this build to TestFlight (default off)'
        type: boolean
        default: false
      reason:
        description: 'Why are you running this iOS job?'
        required: false
        default: 'Manual iOS build'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  ios-no-codesign:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_testflight == false }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - run: flutter pub get
      - name: iOS compile gate (no codesign)
        run: flutter build ios --release --no-codesign

  ios-testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testflight == true }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: ios

      - name: Install dependencies
        working-directory: ios
        run: bundle install

      - run: flutter pub get

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Run Fastlane
        working-directory: ios
        run: bundle exec fastlane ios beta --verbose
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://x-access-token:${{ secrets.MATCH_GIT_TOKEN }}@github.com/HamzaElshennawy/ios-certificates
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
